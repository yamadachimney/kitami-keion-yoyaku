<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>見本データ投入</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.6}input,button{font-size:18px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}button{background:#2448d6;color:#fff;border:0;border-radius:10px}#log{white-space:pre-wrap;background:#f3f4f8;padding:12px;border-radius:10px}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script></head><body>
<h2>見本データ（10/12〜10/18）を入れる</h2>
<p>この週の予約をいったん全部消して、練習表の内容に入れ替えます。</p>
<input id="pin" type="password" placeholder="運営の暗証番号" autocomplete="off">
<button id="go">入れる</button>
<div id="log"></div>
<script>
const WEEK='2026-10-12', REP='やすだこうた';
const PEOPLE=new Set(['宮副','サイトウ','大橋','虎谷','ひろちん','たけひろ','なんじょう','まき','かねこ','おおこし','齊藤直弥','ささきたいせい','よこみぞ','みやぞえ']);
// [曜日(0=月), 名前, 開始, 終了]  時間は 9:00=0 の30分刻み
const D=[
[0,'わがまま',0,2],[0,'はびおじ',2,4],[0,'堀北Maki',4,6],[0,'BUMP',6,10],[0,'大橋',10,12],[0,'虎谷',12,14],[0,'ひろちん',14,17],[0,'たけひろ',17,20],[0,'かねこ',20,24],
[1,'おおこし',0,3],[1,'なんじょう',3,6],[1,'ひろちん',6,8],[1,'はびおじ',8,12],[1,'わがまま',12,15],[1,'たけひろ',15,18],[1,'さばかん',18,20],[1,'まき',20,22],[1,'13分',22,24],
[2,'宮副',0,3],[2,'ドロス',3,6],[2,'虎谷',6,10],[2,'なんじょう',10,12],[2,'たけひろ',12,16],[2,'堀北Maki',16,18],[2,'13分',18,20],[2,'まき',20,22],[2,'さばかん',22,24],
[3,'ドロス',0,2],[3,'サバ缶',2,4],[3,'大橋',4,7],[3,'ひろちん',7,11],[3,'おおこし',11,16],[3,'たけひろ',16,18],[3,'ボカロ',18,20],[3,'まき',20,22],[3,'13分',22,24],
[4,'サイトウ',0,3],[4,'ささきたいせい',3,6],[4,'ラルク',6,8],[4,'よこみぞ',8,11],[4,'おおこし',11,13],[4,'齊藤直弥',13,15],[4,'マイヘア',15,18],[4,'オータム',18,21],[4,'BUMP',21,24],
[5,'はびおじ',0,2],[5,'わがまま',2,4],[5,'りんごしりゅう',4,7],[5,'部会',7,9],[5,'なとり',9,11],[5,'BUMP',11,13],[5,'マイヘア',13,16],[5,'13分',16,20],[5,'よねず',20,24],
[6,'よねず',0,4],[6,'アルス',4,8],[6,'みやぞえ',8,12],[6,'any song',19,24]
];
const log=t=>document.getElementById('log').textContent+=t+'\n';
firebase.initializeApp(window.FB_CONFIG);
document.getElementById('go').onclick=async()=>{
  try{
    const pin=document.getElementById('pin').value;
    const u=(await firebase.auth().signInWithEmailAndPassword(window.FB_ADMIN_EMAIL,pin)).user;
    log('ログインOK');
    const ref=firebase.database().ref('weeks/'+WEEK);
    const cur=(await ref.once('value')).val()||{};
    const up={};
    Object.keys(cur.reqs||{}).forEach(k=>up['reqs/'+k]=null);
    Object.keys(cur.slots||{}).forEach(k=>up['slots/'+k]=null);
    if(Object.keys(up).length){await ref.update(up);log('前のデータを消しました');}
    for(const k in up)delete up[k];
    up['cfg']={phase:'free',order:['band','drum','other'],maxSlots:4};
    const t0=Date.now();
    D.forEach(([day,name,s,e],i)=>{
      const meet=name==='部会', person=PEOPLE.has(name);
      const r={uid:u.uid,band:meet?'部会':(person?'':name),rep:meet?'運営':(person?name:REP),kind:meet||person?'other':'band',day,s,e,dur:e-s,status:'confirmed',createdAt:t0+i};
      const id=ref.child('reqs').push().key;
      up['reqs/'+id]=r;
      for(let k=s;k<e;k++)up['slots/'+day+'_'+k]=id;
    });
    await ref.update(up);
    log(D.length+'件 入れました。サイトを開き直して確認してください。');
  }catch(e){log('エラー：'+(e.code||e.message))}
};
</script></body></html>
